[build-system]
requires = ["setuptools>=61.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
zip-safe = false
license-files = [
    "LICENSE",
]
py-modules = []

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]


[project]
name = "bosonic-DM"
description = "Python package for bosonic DM analysis for the LEGEND-200 experiment"
authors = [
    {name = "Francesco Borra"},
]
readme = "README.md"
requires-python = ">=3.11"
version = "0.1.0"

dependencies = [
    "awkward",
    "dbetto >=1.3.2",
    "h5py",
    "hist",
    "legend-dataflow-scripts >=0.2.2",
    "legend-pydataobj >=1.17.1",
    "legend-pygeom-l200 >=0.8",
    "legend-pygeom-tools >=0.2",
    "legend-pygeom-hpges >=0.9",
    "matplotlib",
    "mplhep >=1.0",
    "numpy",
    "psutil",
    "pyg4ometry",
    "dspeed",
    "pygama >=2.3.6",
    "pylegendmeta >=1.3.5",
    "reboost >=0.10.3,<0.11",
    "revertex >=0.1.2",
    "ruamel.yaml",
    "tqdm",
    "pandas",
    "scipy",
    "uproot",
    "numba",
    "xarray",
    "scikit-learn",
    "particle",
    "hepunits",
    "h5netcdf",
    "corner",
    "emcee",
    "arviz",
    "getdist",
    "ultranest",
    "tables",
    "pyarrow",
    "polars",
    "jax",
    "torch",
    "legend-daq2lh5",
    "cmdstanpy",
]

[project.scripts]
generate-dark-compton = "bosonic_dm.dark_compton_generators:main"
check-dark-compton-stats = "bosonic_dm.check_dark_compton_stats:main"



[project.optional-dependencies]
test = [
    "pytest>=6",
    "pytest-cov>=3",
]


[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = [
  "error",
]
log_cli_level = "INFO"
testpaths = [
  "tests",
]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
extend-select = [
  "ARG",      # flake8-unused-arguments
  "B",        # flake8-bugbear
  "C4",       # flake8-comprehensions
  "EM",       # flake8-errmsg
  "EXE",      # flake8-executable
  "G",        # flake8-logging-format
  "I",        # isort
  "ICN",      # flake8-import-conventions
  "NPY",      # NumPy specific rules
  "PD",       # pandas-vet
  "PGH",      # pygrep-hooks
  "PIE",      # flake8-pie
  "PL",       # pylint
  "PT",       # flake8-pytest-style
  "PTH",      # flake8-use-pathlib
  "RET",      # flake8-return
  "D",        # pydocstyle
  "RUF",      # Ruff-specific
  "SIM",      # flake8-simplify
  "T20",      # flake8-print
  "UP",       # pyupgrade
  "YTT",      # flake8-2020
]
ignore = [
  "PT011",    # `pytest.raises(ValueError)` is too broad
  "PLR09",    # Too many <...>
  "PLR2004",  # Magic value used in comparison
  "ISC001",   # Conflicts with formatter
  "D1",       # Missing docstring — not enforced here
  "D203",     # Incompatible with D211 (no-blank-line-before-class)
  "D213",     # Incompatible with D212 (multi-line-summary-first-line)
  "D401",     # Imperative mood — conflicts with noun-phrase docstring style
  "SIM118",   # Prefer `key in dict` over `key in dict.keys()` — .keys() is more explicit
  "G004",     # Log message template should use %s -- not enforced here
]
isort.required-imports = ["from __future__ import annotations"]
pydocstyle.convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"noxfile.py" = ["T20"]

[tool.pylint]
py-version = "3.9"
ignore-paths = [".*/_version.py"]
reports.output-format = "colorized"
similarities.ignore-imports = "yes"
messages_control.disable = [
  "design",
  "fixme",
  "line-too-long",
  "missing-module-docstring",
  "missing-function-docstring",
  "wrong-import-position",
  "too-many-nested-blocks"
]

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.dependencies]
awkward = "*"
h5py = "*"
matplotlib = "*"
numpy = "*"
pandas = "*"
scipy = "*"
iminuit = "*"
uproot = "*"
numba = "*"
xarray = "*"
scikit-learn = "*"
particle = "*"
hepunits = "*"
h5netcdf = "*"
corner = "*"
emcee = "*"
arviz = "*"
getdist = "*"
ultranest = "*"
pyarrow = "*"
polars = "*"
jax = "*"
pytorch = "*"
tqdm = "*"
psutil = "*"
"ruamel.yaml" = "*"
"pytables" = "*"
"cmdstanpy" = "*"
pre-commit = "*"

[tool.pixi.environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }

[tool.pixi.tasks]
