schema_version: 1

production:
  version: "v2.1.5"
  reference_root: "/path/to/legend/production"
  metadata_override: null

paths:
  simulation_root: "/path/to/simulation/root"
  data_root: "data/v1"
  # Calibration-derived inputs are independent of a simulation production.
  calibration_dictionaries_root: "data/v1/dictionaries"
  plots_root: "plots"
  temporary_root: "tmp"

analysis:
  simulated_energies_keV:
    - 200
    - 300
    - 400
    - 500
    - 600
    - 700
    - 800
    - 900
    - 1000

  fep_window:
    half_width_fwhm: 2.0

  selections:
    - all
    - valid-psd
    - sse
    - mse

interactions:
  axio-electric:
    job_template: "electron_{energy}keV_hpge_bulk"
    make_lar_survival_plots: false

  dark-compton:
    job_template: "fromfile_dark_compton_{energy}keV_hpge_bulk"
    make_lar_survival_plots: true

background:
  pet_glob: "/path/to/pet/root/phy/*.lh5"
  apply_lar_veto: true
  comparison_cut_profile: "without-bb-like"
  energy_ranges_keV:
    - [20, 300]
    - [20, 1000]
  bin_widths_keV:
    - 1
    - 5
    - 10
  detector_groups: "data/v1/dictionaries/detector-grouping/groups_dict.yaml"

output:
  overwrite: false
  save_plots: true
  show_plots: false
  write_manifest: true
