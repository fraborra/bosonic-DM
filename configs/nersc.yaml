schema_version: 1

production:
  version: "v2.1.5"
  reference_root: "${LEGEND_PRODUCTION_ROOT}"
  metadata_override:

paths:
  simulation_root: "${BOSONIC_DM_SIM_ROOT}"
  data_root: "data/v4"
  # Shared inputs root for all static data
  inputs_root: "data/inputs"
  temporary_root: "tmp"

analysis:
  simulated_energies_keV:
    start: 100
    stop: 1020
    step: 10
  fep_window:
    half_width_fwhm: 2.0

  selections:
  - all
  - valid-psd
  - sse
  - mse
  apply_lar_veto: true
  # p09-r004 is missing from the simulation; it uses the efficiency of
  # p09-r005, which has the same calibration and usability.
  efficiency_run_substitutes:
    p09-r004: p09-r005
  # specific file in case you do not want to use the default one
  # in $BOSONIC_DM_ROOT/data/inputs/dictionaries/detector-grouping/groups_dict.yaml
  # detector_groups: "dictionaries/detector-grouping/groups_dict.yaml"

interactions:
  axio-electric:
    job_template: "electron_{energy}keV_hpge_bulk"
    make_lar_survival_plots: false
    make_energy_spectra_plots: false
    make_aoe_survival_plots: false

  dark-compton:
    job_template: "fromfile_dark_compton_{energy}keV_hpge_bulk"
    make_lar_survival_plots: false
    make_energy_spectra_plots: false
    make_aoe_survival_plots: false

background:
  # pet_glob: #if passed override the legend-production folder
  comparison_cut_profile: "without-bb-like"
  energy_ranges_keV:
  - [20, 300]
  - [20, 1000]
  bin_widths_keV:
  - 1
  - 5
  - 10
  # Per-group Stan background fit (stages fit and fit-plots). Every key is
  # optional; the values below are the defaults.
  fit:
    # Prepared group spectrum: energy range and bin width [keV].
    spectrum_range_keV: [60, 2000]
    spectrum_bin_width_keV: 1
    # Range of the spectrum passed to Stan [keV].
    fit_range_keV: [110, 1100]
    # Gamma lines masked in the likelihood; peak_exclusion_width_keV is the half-width.
    # 'standard' = built-in table of 20 gamma lines; or a list of centres
    # in keV, e.g. [583.187, 609.312]; [] masks nothing. Lines whose mask
    # falls outside fit_range_keV are dropped.
    peaks_keV: standard
    peak_exclusion_width_keV: 5.0
    # Per-group curve_fit prefits; a relative path is under paths.inputs_root.
    prefit_dictionary: dictionaries/prefit_dictionary.yaml
    prefit_key: fit_ar
    # no_linear: c0 = cQ = 0 (no linear continuum); full: sample c0 and cQ.
    model: no_linear
    # Log-space prior widths: Ar39 shape parameters and the two rates.
    shape_sd: 0.5
    rate_prior_sd: {n2nu: 0.5, ar39: 2.0}
    sampler: {chains: 4, iter_warmup: 1000, iter_sampling: 1000, seed: 12345}

output:
  overwrite: false
  save_plots: true
  write_manifest: true
